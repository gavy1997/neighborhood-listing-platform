name: Production Release Gates Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Gate 2: Automated Test Suite
      - name: Run Unit Tests
        run: npm test

      # Gate 1: Production Build Check
      - name: Run Type Check and Build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Trigger Vercel Production Deployment
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_71E2wswq8qehmEkxnVisDh7wcaoW/wa8ChYYVOP"
